<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cold open super (transparent)</title><link rel="stylesheet" href="style.css">
<!-- Over the busy six-lane race at 0:08-0:10 (open-busy in edl.json). -->
<style>
  .super { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-1.5deg); padding: 26px 64px 22px; text-align: center; white-space: nowrap; }
  .super .tape { --t: var(--yellow); }
  .t1 { font-size: 104px; font-weight: 800; line-height: 1.05; }
  .t1 b { color: var(--red); font-weight: 800; }
  .t1 b:nth-of-type(2) { color: var(--blue); } .t1 b:nth-of-type(3) { color: var(--green); }
  .t2 { margin-top: 6px; font-size: 64px; color: var(--ink); }
</style></head>
<body>
  <div class="super sticker"><span class="tape"></span>
    <div class="t1"><b>Draw</b> it. <b>Snap</b> it. <b>Race</b> it.</div>
    <div class="t2 hand">What you draw changes how you play.</div>
  </div>
</body></html>

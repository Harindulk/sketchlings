<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>VVD lower-third label (transparent)</title><link rel="stylesheet" href="style.css">
<!-- On every shot of the VVD's picture (captures and the room TV): small, bottom right, below the app's buttons. -->
<style>
  .pill { position: absolute; right: 24px; bottom: 14px; font-size: 28px; padding: 2px 18px 0; border-width: 3px; box-shadow: 3px 4px 0 var(--ink);
    background: #fffdf6e8; gap: 10px; }
  .dot { width: 15px; height: 15px; border-width: 3px; }
</style></head>
<body>
  <div class="pill"><span class="dot"></span>Running on Amazon's Vega Virtual Device</div>
</body></html>

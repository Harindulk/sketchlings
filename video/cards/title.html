<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Title card</title><link rel="stylesheet" href="style.css">
<style>
  .center { position: absolute; inset: 0 0 0 134px; display: flex; flex-direction: column; align-items: center; padding-top: 170px; }
  .wordmark { font-size: 300px; }
  .tag { margin-top: 26px; font-size: 92px; font-weight: 700; color: var(--ink); }
  .tag b { color: var(--red); font-weight: 800; }
  .tag b:nth-of-type(2) { color: var(--blue); } .tag b:nth-of-type(3) { color: var(--green); }
  .pill { margin-top: 44px; font-size: 54px; padding: 10px 44px 6px; }
</style></head>
<body class="paper">
  <img class="deco" src="img/star.svg" style="left: 300px; top: 70px; width: 150px; transform: rotate(-12deg)">
    <img class="deco sprite" src="img/captain-bleep.png" style="left: 170px; bottom: 30px; width: 400px; transform: rotate(-7deg)">
  <img class="deco sprite" src="img/frog.svg" style="right: 90px; bottom: 40px; width: 330px; transform: rotate(6deg)">
  <div class="center">
    <div class="wordmark"><span>S</span><span>k</span><span>e</span><span>t</span><span>c</span><span>h</span><span>l</span><span>i</span><span>n</span><span>g</span><span>s</span></div>
    <div class="tag"><b>Draw</b> it. <b>Snap</b> it. Watch it <b>race!</b></div>
    <div class="pill"><span class="dot"></span>Running on Fire TV · Vega OS</div>
  </div>
</body></html>

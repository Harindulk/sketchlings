<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>End card</title><link rel="stylesheet" href="style.css">
<style>
  .joke { position: absolute; left: 50%; top: 70px; transform: translateX(-50%) rotate(-1.5deg); padding: 20px 52px 16px; text-align: center; white-space: nowrap; border-radius: 30px; }
  .joke .tape { --t: var(--yellow); }
  .joke b { display: block; font-size: 56px; font-weight: 800; line-height: 1.05; }
  .joke span { font-size: 40px; color: var(--ink-soft); }
  .center { position: absolute; inset: 0 0 0 134px; display: flex; flex-direction: column; align-items: center; padding-top: 300px; }
  .wordmark { font-size: 230px; }
  .pill { margin-top: 30px; font-size: 54px; padding: 8px 44px 4px; }
  .repo { margin-top: 30px; font-size: 64px; font-weight: 800; }
  .row { margin-top: 18px; display: flex; gap: 26px; font-size: 44px; font-weight: 700; color: var(--ink-soft); }
  .row i { font-style: normal; color: var(--red); }
  .credit { position: absolute; left: 0; right: 0; bottom: 26px; text-align: center; font-size: 30px; color: var(--ink-soft); padding-left: 134px; }
</style></head>
<body class="paper">
  <img class="deco sprite" src="img/captain-bleep.png" style="left: 160px; bottom: 90px; width: 330px; transform: rotate(-8deg)">
  <img class="deco sprite" src="img/frog.svg" style="right: 70px; bottom: 80px; width: 300px; transform: rotate(7deg)">
  <div class="joke sticker"><span class="tape"></span><b>No crayons were harmed in the making of this race.</b><span class="hand">(One is still under the couch.)</span></div>
  <div class="center">
    <div class="wordmark"><span>S</span><span>k</span><span>e</span><span>t</span><span>c</span><span>h</span><span>l</span><span>i</span><span>n</span><span>g</span><span>s</span></div>
    <div class="pill"><span class="dot"></span>Built for Fire TV on Vega OS</div>
    <div class="repo">github.com/Harindulk/sketchlings</div>
    <div class="row"><span>doodle-cutout (MIT)</span><i>·</i><span>StarFun Games</span></div>
  </div>
  <div class="credit hand">Music (CC0): "Happy Clappy Loop" by OwlishMedia · "Happy Beat" by burabotti, via OpenGameArt.org</div>
</body></html>

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketchlings live view</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
  :fullscreen, :fullscreen canvas { cursor: none; }
  .note { position: fixed; left: 50%; transform: translateX(-50%); font: 16px system-ui, sans-serif; color: #fff;
          background: #000a; padding: 8px 14px; border-radius: 8px; pointer-events: none; transition: opacity 1s; }
  #hint { bottom: 24px; }
  #msg { top: 45%; }
  #fps { position: fixed; top: 6px; right: 8px; font: 12px ui-monospace, monospace; color: #fff9; display: none; }
  .gone { opacity: 0; }
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hint" class="note">Click for full screen · arrows, Enter, Backspace = remote · Space = ROAR · F shows fps</div>
<div id="msg" class="note">Connecting…</div>
<div id="fps"></div>
<script>
const $ = (id) => document.getElementById(id), c = $("c");
const gl = c.getContext("webgl", { alpha: false, antialias: false, depth: false });

// One textured full-screen quad. The emulator sends RGB888 rows top-down (its proto says bottom-up; it is not), so flip v.
const prog = gl.createProgram();
for (const [type, src] of [
  [gl.VERTEX_SHADER, "attribute vec2 p; varying vec2 uv; void main() { uv = vec2(p.x * .5 + .5, .5 - p.y * .5); gl_Position = vec4(p, 0, 1); }"],
  [gl.FRAGMENT_SHADER, "precision mediump float; uniform sampler2D t; varying vec2 uv; void main() { gl_FragColor = texture2D(t, uv); }"],
]) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); gl.attachShader(prog, s); }
gl.bindAttribLocation(prog, 0, "p"); gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
for (const k of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR);
for (const k of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE);
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);

let meta = null, pending = null, texW = 0, texH = 0, frames = 0, lat = 0;
function draw() {
  requestAnimationFrame(draw);
  if (!pending) return;
  const { w, h, t } = pending.meta, px = new Uint8Array(pending.data);
  pending = null;
  if (w !== texW || h !== texH) {
    texW = c.width = w; texH = c.height = h; gl.viewport(0, 0, w, h);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, w, h, 0, gl.RGB, gl.UNSIGNED_BYTE, px);
  } else gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, w, h, gl.RGB, gl.UNSIGNED_BYTE, px);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  frames++; lat += Date.now() - t; // emulator frame time -> drawn here (same Mac clock)
}
requestAnimationFrame(draw);
setInterval(() => { $("fps").textContent = `${frames} fps · ${frames ? Math.round(lat / frames) : "-"} ms`; frames = lat = 0; }, 1000);

function show(text) { $("msg").textContent = text; $("msg").classList.toggle("gone", !text); }
let sock = null; // the current socket, used by the keyboard remote
function connect() {
  const ws = new WebSocket(`ws://${location.host}/`);
  sock = ws;
  ws.binaryType = "arraybuffer";
  ws.onmessage = (e) => {
    if (typeof e.data !== "string") { if (meta) pending = { meta, data: e.data }; show(""); return; }
    meta = JSON.parse(e.data);
    if (meta.status !== undefined) { show(meta.status); meta = null; }
  };
  ws.onclose = () => { show("Reconnecting…"); setTimeout(connect, 1000); };
}
connect();

addEventListener("click", () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
// The keyboard is the Fire TV remote (the server forwards presses to the VVD).
const REMOTE = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", Enter: "select", Backspace: "back", Escape: "back", " ": "playpause", m: "menu", M: "menu" };
addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "F") { $("fps").style.display = $("fps").style.display === "block" ? "none" : "block"; return; }
  const key = REMOTE[e.key];
  if (!key || e.repeat) return;
  e.preventDefault(); // no page scroll on arrows/space; Esc still leaves full screen first in most browsers
  if (sock && sock.readyState === 1) sock.send(JSON.stringify({ key }));
});
document.addEventListener("fullscreenchange", () => $("hint").classList.add("gone"));
setTimeout(() => $("hint").classList.add("gone"), 6000);
</script>
</html>
